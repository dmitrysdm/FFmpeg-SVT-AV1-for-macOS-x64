name: Build FFmpeg for macOS Intel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEG_VERSION: "9.0.1"
  FFMPEG_COMMIT: "bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa"

  SVT_AV1_VERSION: "4.2.0"
  SVT_AV1_TAG: "v4.2.0"

  OPUS_VERSION: "1.5.2"

  PACKAGE_NAME: "FFmpeg-9.0.1-SVT-AV1-4.2.0-for-macOS-x64"

jobs:
  build:
    name: Build FFmpeg 9.0.1 for macOS Intel
    runs-on: macos-15-intel

    steps:

      # =====================================================================
      # Checkout
      # =====================================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== System ==="
          sw_vers
          uname -a

          echo "=== Architecture ==="
          uname -m
          arch

          echo "=== CPU ==="
          sysctl -n hw.model
          sysctl -n hw.ncpu

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "ERROR: This workflow requires an Intel x86_64 runner."
            exit 1
          fi

      # =====================================================================
      # Dependencies
      # =====================================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew update

          brew install \
            cmake \
            nasm \
            pkg-config \
            autoconf \
            automake \
            libtool \
            sdl2

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== clang ==="
          clang --version

          echo "=== make ==="
          make --version | head -n 1

          echo "=== cmake ==="
          cmake --version | head -n 1

          echo "=== nasm ==="
          nasm -v

          echo "=== pkg-config ==="
          pkg-config --version

          echo "=== SDL2 ==="
          pkg-config --modversion sdl2 || true
          pkg-config --cflags sdl2 || true
          pkg-config --libs sdl2 || true

      # =====================================================================
      # Build directories
      # =====================================================================

      - name: Prepare build directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/ffmpeg-build"

          mkdir -p \
            "$RUNNER_TEMP/ffmpeg-build/src" \
            "$RUNNER_TEMP/ffmpeg-build/build" \
            "$RUNNER_TEMP/ffmpeg-build/prefix" \
            "$RUNNER_TEMP/ffmpeg-build/package"

          echo "BUILD_ROOT=$RUNNER_TEMP/ffmpeg-build" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/ffmpeg-build/prefix" >> "$GITHUB_ENV"

      # =====================================================================
      # SVT-AV1
      # =====================================================================

      - name: Download SVT-AV1
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/src"

          git clone \
            --depth 1 \
            --branch "$SVT_AV1_TAG" \
            https://github.com/AOMediaCodec/SVT-AV1.git \
            SVT-AV1

      - name: Build SVT-AV1 static
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/src/SVT-AV1"

          cmake \
            -S . \
            -B "$BUILD_ROOT/build/svt-av1" \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_APPS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=x86_64

          cmake \
            --build "$BUILD_ROOT/build/svt-av1" \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)"

          cmake \
            --install "$BUILD_ROOT/build/svt-av1"

      - name: Verify static SVT-AV1
        shell: bash
        run: |
          set -euxo pipefail

          SVT_LIB="$PREFIX/lib/libSvtAv1Enc.a"

          echo "=== SVT-AV1 files ==="

          find "$PREFIX" \
            \( -name '*SvtAv1*' -o -name '*svtav1*' \) \
            -print

          echo
          echo "=== Static library ==="

          test -f "$SVT_LIB"

          file "$SVT_LIB"

          if find "$PREFIX/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libSvtAv1Enc*.dylib' \
            -print -quit | grep -q .; then

            echo "ERROR: Shared SVT-AV1 library was built."
            exit 1
          fi

          echo
          echo "=== Archive members ==="

          ar -t "$SVT_LIB" | head -n 30

          echo
          echo "=== SVT-AV1 archive size ==="

          ls -lh "$SVT_LIB"

          test -s "$SVT_LIB"

          echo
          echo "SVT-AV1 static library verified."

      # =====================================================================
      # Opus
      # =====================================================================

      - name: Download Opus
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/src"

          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            -o "opus-${OPUS_VERSION}.tar.gz" \
            "https://github.com/xiph/opus/releases/download/v${OPUS_VERSION}/opus-${OPUS_VERSION}.tar.gz"

          tar \
            -xzf \
            "opus-${OPUS_VERSION}.tar.gz"

      - name: Build Opus static
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/src/opus-${OPUS_VERSION}"

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-doc \
            --disable-extra-programs \
            --disable-maintainer-mode

          make -j"$(sysctl -n hw.ncpu)"

          make install

      - name: Verify static Opus
        shell: bash
        run: |
          set -euxo pipefail

          OPUS_LIB="$PREFIX/lib/libopus.a"

          test -f "$OPUS_LIB"

          file "$OPUS_LIB"

          if find "$PREFIX/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libopus*.dylib' \
            -print -quit | grep -q .; then

            echo "ERROR: Shared Opus library was built."
            exit 1
          fi

          echo
          echo "=== Opus archive ==="

          ar -t "$OPUS_LIB" | head -n 30

          echo
          echo "=== Opus archive size ==="

          ls -lh "$OPUS_LIB"

          test -s "$OPUS_LIB"

          echo
          echo "Opus static library verified."

      # =====================================================================
      # pkg-config
      # =====================================================================

      - name: Configure pkg-config paths
        shell: bash
        run: |
          set -euxo pipefail

          SDL2_PREFIX="$(brew --prefix sdl2)"

          echo "SDL2_PREFIX=$SDL2_PREFIX" >> "$GITHUB_ENV"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$SDL2_PREFIX/lib/pkgconfig"

          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

          echo "CFLAGS=-I$PREFIX/include -I$SDL2_PREFIX/include" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$PREFIX/include -I$SDL2_PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$PREFIX/lib -L$SDL2_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Verify pkg-config dependencies
        shell: bash
        run: |
          set -euxo pipefail

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$SDL2_PREFIX/lib/pkgconfig"

          echo "=== SVT-AV1 ==="

          pkg-config --modversion SvtAv1Enc
          pkg-config --cflags SvtAv1Enc
          pkg-config --libs SvtAv1Enc

          echo
          echo "=== Opus ==="

          pkg-config --modversion opus
          pkg-config --cflags opus
          pkg-config --libs opus

          echo
          echo "=== SDL2 ==="

          pkg-config --modversion sdl2
          pkg-config --cflags sdl2
          pkg-config --libs sdl2

      # =====================================================================
      # FFmpeg source
      # =====================================================================

      - name: Download FFmpeg
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/src"

          git clone \
            https://github.com/FFmpeg/FFmpeg.git \
            ffmpeg

          cd ffmpeg

          git checkout "$FFMPEG_COMMIT"

          echo "FFmpeg commit:"
          git rev-parse HEAD

          EXPECTED="$FFMPEG_COMMIT"
          ACTUAL="$(git rev-parse HEAD)"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Unexpected FFmpeg commit."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

      # =====================================================================
      # FFmpeg configure
      # =====================================================================

      - name: Configure FFmpeg
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/src/ffmpeg"

          SDL2_PREFIX="$(brew --prefix sdl2)"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$SDL2_PREFIX/lib/pkgconfig"

          export CFLAGS="-I$PREFIX/include -I$SDL2_PREFIX/include"
          export CPPFLAGS="-I$PREFIX/include -I$SDL2_PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib -L$SDL2_PREFIX/lib"

          echo "=== SDL2 ==="
          echo "SDL2_PREFIX=$SDL2_PREFIX"

          pkg-config --modversion sdl2
          pkg-config --cflags sdl2
          pkg-config --libs sdl2

          echo
          echo "=== SVT-AV1 ==="

          pkg-config --modversion SvtAv1Enc
          pkg-config --cflags SvtAv1Enc
          pkg-config --libs SvtAv1Enc

          echo
          echo "=== Opus ==="

          pkg-config --modversion opus
          pkg-config --cflags opus
          pkg-config --libs opus

          echo
          echo "=== FFmpeg configure ==="

          ./configure \
            --prefix="$PREFIX" \
            --bindir="$PREFIX/bin" \
            --datadir="$PREFIX/share/ffmpeg" \
            --disable-debug \
            --disable-doc \
            --disable-autodetect \
            --disable-shared \
            --enable-static \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-ffplay \
            --enable-avcodec \
            --enable-avformat \
            --enable-avfilter \
            --enable-avdevice \
            --enable-swscale \
            --enable-swresample \
            --enable-postproc \
            --enable-network \
            --enable-protocol=file \
            --enable-protocol=pipe \
            --enable-protocol=http \
            --enable-protocol=https \
            --enable-demuxer=mov \
            --enable-demuxer=matroska \
            --enable-demuxer=ogg \
            --enable-muxer=mp4 \
            --enable-muxer=matroska \
            --enable-muxer=ogg \
            --enable-muxer=webm \
            --enable-filter=scale \
            --enable-filter=fps \
            --enable-filter=setsar \
            --enable-filter=dynaudnorm \
            --enable-libsvtav1 \
            --enable-libopus \
            --enable-sdl2 \
            --enable-gpl \
            --enable-version3 \
            --arch=x86_64 \
            --target-os=darwin \
            --cc=clang \
            --cxx=clang++ \
            --extra-cflags="-I$PREFIX/include -I$SDL2_PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib -L$SDL2_PREFIX/lib"

      - name: Show FFmpeg configure summary
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/src/ffmpeg"

          echo "=== FFmpeg config summary ==="

          grep -E \
            '^(install prefix|source path|C compiler|C library|ARCH|static|shared|ffmpeg|ffprobe|ffplay|SDL2|libsvtav1|libopus)' \
            ffbuild/config.log \
            | tail -n 100 || true

      # =====================================================================
      # FFmpeg build
      # =====================================================================

      - name: Build FFmpeg
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/src/ffmpeg"

          make -j"$(sysctl -n hw.ncpu)"

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/src/ffmpeg"

          make install

      # =====================================================================
      # Binary verification
      # =====================================================================

      - name: Verify FFmpeg binaries exist
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$PREFIX/bin/ffmpeg"
          test -x "$PREFIX/bin/ffprobe"
          test -x "$PREFIX/bin/ffplay"

          ls -lh \
            "$PREFIX/bin/ffmpeg" \
            "$PREFIX/bin/ffprobe" \
            "$PREFIX/bin/ffplay"

      - name: Verify Intel x86_64 binaries
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== ffmpeg ==="
          file "$PREFIX/bin/ffmpeg"

          echo
          echo "=== ffprobe ==="
          file "$PREFIX/bin/ffprobe"

          echo
          echo "=== ffplay ==="
          file "$PREFIX/bin/ffplay"

          file "$PREFIX/bin/ffmpeg" \
            | grep -q "Mach-O 64-bit executable x86_64"

          file "$PREFIX/bin/ffprobe" \
            | grep -q "Mach-O 64-bit executable x86_64"

          file "$PREFIX/bin/ffplay" \
            | grep -q "Mach-O 64-bit executable x86_64"

      # =====================================================================
      # FFmpeg features
      # =====================================================================

      - name: Verify FFmpeg configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== ffmpeg ==="

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -version

          echo
          echo "=== ffprobe ==="

          "$PREFIX/bin/ffprobe" \
            -hide_banner \
            -version

          echo
          echo "=== ffplay ==="

          "$PREFIX/bin/ffplay" \
            -hide_banner \
            -version

          echo
          echo "=== Encoders ==="

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -encoders \
            | grep -E 'libsvtav1|libopus'

          echo
          echo "=== Decoders ==="

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -decoders \
            | grep -E 'opus|av1'

          echo
          echo "=== Filters ==="

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -filters \
            | grep -E 'scale|fps|setsar|dynaudnorm'

          echo
          echo "=== Pixel formats ==="

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -pix_fmts \
            | grep 'yuv420p10le'

          echo
          echo "=== Protocols ==="

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -protocols \
            | grep -E 'file|pipe|http|https'

      - name: Verify SVT-AV1 encoder
        shell: bash
        run: |
          set -euxo pipefail

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -h encoder=libsvtav1 \
            | head -n 40

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -encoders \
            | grep -q 'libsvtav1'

      - name: Verify Opus encoder
        shell: bash
        run: |
          set -euxo pipefail

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -h encoder=libopus \
            | head -n 40

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -encoders \
            | grep -q 'libopus'

      - name: Verify FFplay
        shell: bash
        run: |
          set -euxo pipefail

          "$PREFIX/bin/ffplay" \
            -hide_banner \
            -version

          "$PREFIX/bin/ffplay" \
            -hide_banner \
            -h full \
            >/dev/null

          echo "FFplay executable is functional."

      # =====================================================================
      # Static linkage verification
      # =====================================================================

      - name: Verify SVT-AV1 and Opus are not dynamic dependencies
        shell: bash
        run: |
          set -euxo pipefail

          for binary in \
            "$PREFIX/bin/ffmpeg" \
            "$PREFIX/bin/ffprobe" \
            "$PREFIX/bin/ffplay"
          do
            echo
            echo "============================================================"
            echo "$binary"
            echo "============================================================"

            otool -L "$binary"

            if otool -L "$binary" | grep -Ei \
              'libSvtAv1|SvtAv1Enc|libopus'; then

              echo
              echo "ERROR: Dynamic SVT-AV1 or Opus dependency found."
              echo "Binary: $binary"

              exit 1
            fi
          done

          echo
          echo "SVT-AV1 and Opus are statically linked."

      - name: Verify embedded SVT-AV1 and Opus
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== SVT-AV1 symbols in ffmpeg ==="

          if ! nm "$PREFIX/bin/ffmpeg" \
            | grep -E \
              'EbInitEncoder|svt_av1_enc_init_handle' \
            | head -n 20; then

            echo "WARNING: Expected SVT-AV1 symbol was not found by this name."
            echo "This is not treated as a build failure."
          fi

          echo
          echo "=== Opus symbols in ffmpeg ==="

          if ! nm "$PREFIX/bin/ffmpeg" \
            | grep -E \
              'opus_encoder_create|opus_encode' \
            | head -n 20; then

            echo "WARNING: Expected Opus symbol was not found by this name."
            echo "This is not treated as a build failure."
          fi

          echo
          echo "Embedded-library symbol inspection completed."

      # =====================================================================
      # Bundle SDL2 for FFplay
      # =====================================================================

      - name: Bundle SDL2 with FFplay
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$PREFIX/lib"

          SDL2_DEPENDENCY="$(
            otool -L "$PREFIX/bin/ffplay" \
              | awk '/libSDL2.*\.dylib/ {print $1; exit}'
          )"

          if [ -z "$SDL2_DEPENDENCY" ]; then
            echo "ERROR: SDL2 dependency was not found in ffplay."
            exit 1
          fi

          echo "Detected SDL2 dependency:"
          echo "$SDL2_DEPENDENCY"

          SDL2_FILENAME="$(basename "$SDL2_DEPENDENCY")"

          if [ ! -f "$SDL2_DEPENDENCY" ]; then
            SDL2_REALPATH="$(
              realpath "$SDL2_DEPENDENCY" 2>/dev/null \
              || true
            )

            if [ -n "$SDL2_REALPATH" ] \
              && [ -f "$SDL2_REALPATH" ]; then

              SDL2_DEPENDENCY="$SDL2_REALPATH"
            fi
          fi

          if [ ! -f "$SDL2_DEPENDENCY" ]; then
            echo "ERROR: SDL2 library does not exist:"
            echo "$SDL2_DEPENDENCY"
            exit 1
          fi

          cp -L \
            "$SDL2_DEPENDENCY" \
            "$PREFIX/lib/$SDL2_FILENAME"

          chmod 755 \
            "$PREFIX/lib/$SDL2_FILENAME"

          install_name_tool \
            -change \
            "$(
              otool -L "$PREFIX/bin/ffplay" \
                | awk '/libSDL2.*\.dylib/ {print $1; exit}'
            )" \
            "@loader_path/../lib/$SDL2_FILENAME" \
            "$PREFIX/bin/ffplay"

          echo
          echo "=== ffplay dependencies after SDL2 relocation ==="

          otool -L "$PREFIX/bin/ffplay"

          test -f "$PREFIX/lib/$SDL2_FILENAME"

      - name: Verify bundled SDL2
        shell: bash
        run: |
          set -euxo pipefail

          SDL2_BUNDLED="$(
            find "$PREFIX/lib" \
              -maxdepth 1 \
              -type f \
              -name 'libSDL2*.dylib' \
              -print \
              | head -n 1
          )"

          if [ -z "$SDL2_BUNDLED" ]; then
            echo "ERROR: Bundled SDL2 was not found."
            exit 1
          fi

          echo "Bundled SDL2:"
          echo "$SDL2_BUNDLED"

          file "$SDL2_BUNDLED"

          echo
          echo "=== ffplay SDL2 dependency ==="

          otool -L "$PREFIX/bin/ffplay" \
            | grep -E 'SDL2|loader_path'

      # =====================================================================
      # Functional tests
      # =====================================================================

      - name: Test FFmpeg with SVT-AV1
        shell: bash
        run: |
          set -euxo pipefail

          TEST_DIR="$BUILD_ROOT/tests"

          mkdir -p "$TEST_DIR"

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -loglevel error \
            -f lavfi \
            -i "testsrc2=size=320x240:rate=10" \
            -frames:v 10 \
            -pix_fmt yuv420p10le \
            -c:v libsvtav1 \
            -preset 12 \
            -crf 35 \
            -an \
            "$TEST_DIR/svt-av1-test.ivf"

          test -s "$TEST_DIR/svt-av1-test.ivf"

          "$PREFIX/bin/ffprobe" \
            -hide_banner \
            -v error \
            -select_streams v:0 \
            -show_entries \
              stream=codec_name,pix_fmt,width,height \
            -of default=noprint_wrappers=1 \
            "$TEST_DIR/svt-av1-test.ivf"

      - name: Test FFmpeg with Opus
        shell: bash
        run: |
          set -euxo pipefail

          TEST_DIR="$BUILD_ROOT/tests"

          mkdir -p "$TEST_DIR"

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -loglevel error \
            -f lavfi \
            -i "sine=frequency=1000:sample_rate=48000" \
            -t 1 \
            -c:a libopus \
            -b:a 96k \
            "$TEST_DIR/opus-test.ogg"

          test -s "$TEST_DIR/opus-test.ogg"

          "$PREFIX/bin/ffprobe" \
            -hide_banner \
            -v error \
            -select_streams a:0 \
            -show_entries \
              stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$TEST_DIR/opus-test.ogg"

      - name: Test combined AV1 and Opus
        shell: bash
        run: |
          set -euxo pipefail

          TEST_DIR="$BUILD_ROOT/tests"

          mkdir -p "$TEST_DIR"

          "$PREFIX/bin/ffmpeg" \
            -hide_banner \
            -loglevel error \
            -f lavfi \
            -i "testsrc2=size=640x360:rate=24" \
            -f lavfi \
            -i "sine=frequency=1000:sample_rate=48000" \
            -t 2 \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libsvtav1 \
            -preset 12 \
            -crf 35 \
            -pix_fmt yuv420p10le \
            -c:a libopus \
            -b:a 96k \
            -shortest \
            "$TEST_DIR/combined.mkv"

          test -s "$TEST_DIR/combined.mkv"

          "$PREFIX/bin/ffprobe" \
            -hide_banner \
            -v error \
            -show_entries \
              stream=index,codec_type,codec_name,pix_fmt,width,height,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$TEST_DIR/combined.mkv"

      - name: Test FFplay binary
        shell: bash
        run: |
          set -euxo pipefail

          "$PREFIX/bin/ffplay" \
            -hide_banner \
            -version

          "$PREFIX/bin/ffplay" \
            -hide_banner \
            -h full \
            >/dev/null

          echo "FFplay executable is functional."

      # =====================================================================
      # Licenses
      # =====================================================================

      - name: Collect licenses
        shell: bash
        run: |
          set -euxo pipefail

          LICENSE_DIR="$PREFIX/licenses"

          mkdir -p "$LICENSE_DIR"

          if [ -f "$BUILD_ROOT/src/ffmpeg/COPYING.LGPLv2.1" ]; then
            cp \
              "$BUILD_ROOT/src/ffmpeg/COPYING.LGPLv2.1" \
              "$LICENSE_DIR/FFmpeg-COPYING.LGPLv2.1"
          fi

          if [ -f "$BUILD_ROOT/src/ffmpeg/COPYING.GPLv2" ]; then
            cp \
              "$BUILD_ROOT/src/ffmpeg/COPYING.GPLv2" \
              "$LICENSE_DIR/FFmpeg-COPYING.GPLv2"
          fi

          if [ -f "$BUILD_ROOT/src/ffmpeg/COPYING.GPLv3" ]; then
            cp \
              "$BUILD_ROOT/src/ffmpeg/COPYING.GPLv3" \
              "$LICENSE_DIR/FFmpeg-COPYING.GPLv3"
          fi

          if [ -f "$BUILD_ROOT/src/SVT-AV1/LICENSE.md" ]; then
            cp \
              "$BUILD_ROOT/src/SVT-AV1/LICENSE.md" \
              "$LICENSE_DIR/SVT-AV1-LICENSE.md"
          fi

          if [ -f "$BUILD_ROOT/src/opus-${OPUS_VERSION}/COPYING" ]; then
            cp \
              "$BUILD_ROOT/src/opus-${OPUS_VERSION}/COPYING" \
              "$LICENSE_DIR/Opus-COPYING"
          fi

          if [ -f "$SDL2_PREFIX/share/licenses/sdl2/LICENSE.txt" ]; then
            cp \
              "$SDL2_PREFIX/share/licenses/sdl2/LICENSE.txt" \
              "$LICENSE_DIR/SDL2-LICENSE.txt"
          elif [ -f "$SDL2_PREFIX/share/doc/sdl2/LICENSE.txt" ]; then
            cp \
              "$SDL2_PREFIX/share/doc/sdl2/LICENSE.txt" \
              "$LICENSE_DIR/SDL2-LICENSE.txt"
          else
            echo "SDL2 license file was not found in Homebrew prefix."

            find "$SDL2_PREFIX/share" \
              -maxdepth 4 \
              -iname '*license*' \
              -print || true
          fi

      # =====================================================================
      # Package
      # =====================================================================

      - name: Create package
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_DIR="$BUILD_ROOT/package/$PACKAGE_NAME"

          rm -rf "$PACKAGE_DIR"

          mkdir -p "$PACKAGE_DIR/bin"
          mkdir -p "$PACKAGE_DIR/lib"
          mkdir -p "$PACKAGE_DIR/licenses"

          cp \
            "$PREFIX/bin/ffmpeg" \
            "$PACKAGE_DIR/bin/"

          cp \
            "$PREFIX/bin/ffprobe" \
            "$PACKAGE_DIR/bin/"

          cp \
            "$PREFIX/bin/ffplay" \
            "$PACKAGE_DIR/bin/"

          find "$PREFIX/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libSDL2*.dylib' \
            -exec cp {} "$PACKAGE_DIR/lib/" \;

          cp -R \
            "$PREFIX/licenses/." \
            "$PACKAGE_DIR/licenses/"

          printf '%s\n' \
            "FFmpeg ${FFMPEG_VERSION} for macOS Intel x86_64" \
            "" \
            "Included:" \
            "  ffmpeg" \
            "  ffprobe" \
            "  ffplay" \
            "" \
            "Built with:" \
            "  SVT-AV1 ${SVT_AV1_VERSION} (static)" \
            "  Opus ${OPUS_VERSION} (static)" \
            "  SDL2 (bundled for ffplay)" \
            "" \
            "Architecture:" \
            "  x86_64 / Intel" \
            "" \
            "FFmpeg commit:" \
            "  ${FFMPEG_COMMIT}" \
            "" \
            "Notes:" \
            "  SVT-AV1 and Opus are statically linked into the FFmpeg binaries." \
            "  FFplay uses the bundled SDL2 dynamic library." \
            "" \
            "The binaries were tested during the GitHub Actions build." \
            > "$PACKAGE_DIR/README.txt"

      # =====================================================================
      # Final verification
      # =====================================================================

      - name: Final package verification
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_DIR="$BUILD_ROOT/package/$PACKAGE_NAME"

          echo "=== Package contents ==="

          find "$PACKAGE_DIR" \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          echo
          echo "=== Required binaries ==="

          test -x "$PACKAGE_DIR/bin/ffmpeg"
          test -x "$PACKAGE_DIR/bin/ffprobe"
          test -x "$PACKAGE_DIR/bin/ffplay"

          echo
          echo "=== Binary architectures ==="

          file \
            "$PACKAGE_DIR/bin/ffmpeg" \
            "$PACKAGE_DIR/bin/ffprobe" \
            "$PACKAGE_DIR/bin/ffplay"

          file "$PACKAGE_DIR/bin/ffmpeg" \
            | grep -q "Mach-O 64-bit executable x86_64"

          file "$PACKAGE_DIR/bin/ffprobe" \
            | grep -q "Mach-O 64-bit executable x86_64"

          file "$PACKAGE_DIR/bin/ffplay" \
            | grep -q "Mach-O 64-bit executable x86_64"

          echo
          echo "=== Final ffplay dependencies ==="

          otool -L "$PACKAGE_DIR/bin/ffplay"

          echo
          echo "=== Check for dynamic SVT-AV1 / Opus ==="

          for binary in \
            "$PACKAGE_DIR/bin/ffmpeg" \
            "$PACKAGE_DIR/bin/ffprobe" \
            "$PACKAGE_DIR/bin/ffplay"
          do
            if otool -L "$binary" | grep -Ei \
              'libSvtAv1|SvtAv1Enc|libopus'; then

              echo "ERROR: Dynamic SVT-AV1 or Opus dependency found:"
              echo "$binary"

              exit 1
            fi
          done

          echo
          echo "Final package verification successful."

      # =====================================================================
      # Archive
      # =====================================================================

      - name: Create archive
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD_ROOT/package"

          tar \
            -czf \
            "${PACKAGE_NAME}.tar.gz" \
            "$PACKAGE_NAME"

          ls -lh \
            "${PACKAGE_NAME}.tar.gz"

          echo \
            "PACKAGE_ARCHIVE=$BUILD_ROOT/package/${PACKAGE_NAME}.tar.gz" \
            >> "$GITHUB_ENV"

      - name: Verify archive
        shell: bash
        run: |
          set -euxo pipefail

          test -f "$PACKAGE_ARCHIVE"

          echo "=== Archive contents ==="

          tar \
            -tzf "$PACKAGE_ARCHIVE" \
            | sed -n '1,100p'

      # =====================================================================
      # Upload
      # =====================================================================

      - name: Upload FFmpeg package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
