name: Build FFmpeg for macOS Intel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEG_VERSION: "9.0.1"
  FFMPEG_COMMIT: "bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa"

  SVT_AV1_VERSION: "4.2.0"
  SVT_AV1_TAG: "v4.2.0"

  OPUS_VERSION: "1.5.2"

  PACKAGE_NAME: "FFmpeg-9.0.1-SVT-AV1-4.2.0-for-macOS-x64"

jobs:
  build:
    name: Build FFmpeg 9.0.1 for macOS Intel
    runs-on: macos-15-intel

    steps:

      # ================================================================
      # Checkout
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # Dependencies
      # ================================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            cmake \
            nasm \
            pkg-config \
            autoconf \
            automake \
            libtool

      # ================================================================
      # Verify build environment
      # ================================================================

      - name: Verify build architecture
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "System"
          echo "========================================"

          uname -a

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CPU:"
          sysctl -n machdep.cpu.brand_string

          echo ""
          echo "CPU cores:"
          sysctl -n hw.ncpu

          echo ""
          echo "Compiler:"
          clang --version

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "NASM:"
          nasm -v

          echo ""
          echo "pkg-config:"
          pkg-config --version

          if [ "$(uname -m)" != "x86_64" ]; then
            echo ""
            echo "ERROR: This workflow requires an Intel x86_64 runner."
            exit 1
          fi

          echo ""
          echo "SUCCESS: Intel x86_64 runner confirmed."

      # ================================================================
      # Prepare directories
      # ================================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$GITHUB_WORKSPACE/dist"

          mkdir -p "$GITHUB_WORKSPACE/build/src"
          mkdir -p "$GITHUB_WORKSPACE/build/prefix"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          echo "BUILD_ROOT=$GITHUB_WORKSPACE/build" >> "$GITHUB_ENV"
          echo "SRC_DIR=$GITHUB_WORKSPACE/build/src" >> "$GITHUB_ENV"
          echo "PREFIX=$GITHUB_WORKSPACE/build/prefix" >> "$GITHUB_ENV"

      # ================================================================
      # Build SVT-AV1
      # ================================================================

      - name: Build SVT-AV1
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building SVT-AV1 $SVT_AV1_VERSION"
          echo "========================================"

          git clone \
            --depth 1 \
            --branch "$SVT_AV1_TAG" \
            https://github.com/AOMediaCodec/SVT-AV1.git \
            svt-av1

          cd svt-av1

          echo ""
          echo "SVT-AV1 commit:"
          git rev-parse HEAD

          echo ""
          echo "Configuring static build..."

          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_NASM=ON

          echo ""
          echo "Building..."

          cmake \
            --build build \
            --parallel "$(sysctl -n hw.ncpu)"

          echo ""
          echo "Installing..."

          cmake \
            --install build

      # ================================================================
      # Verify SVT-AV1 static library
      # ================================================================

      - name: Verify SVT-AV1 static library
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SVT-AV1 static library verification"
          echo "========================================"

          SVT_STATIC_LIB="$PREFIX/lib/libSvtAv1Enc.a"

          if [ ! -f "$SVT_STATIC_LIB" ]; then
            echo "ERROR: Static SVT-AV1 library was not found:"
            echo "$SVT_STATIC_LIB"
            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$SVT_STATIC_LIB"

          echo ""
          echo "File type:"
          file "$SVT_STATIC_LIB"

          if ! file "$SVT_STATIC_LIB" | grep -q "current ar archive"; then
            echo "ERROR: SVT-AV1 is not an ar static archive."
            exit 1
          fi

          echo ""
          echo "Archive contents:"
          ar -t "$SVT_STATIC_LIB" | head -30

          echo ""
          echo "Static library size:"
          ls -lh "$SVT_STATIC_LIB"

          echo ""
          echo "SVT-AV1 static library verified successfully."

      # ================================================================
      # Build Opus
      # ================================================================

      - name: Build Opus
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building Opus $OPUS_VERSION"
          echo "========================================"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/xiph/opus/releases/download/v${OPUS_VERSION}/opus-${OPUS_VERSION}.tar.gz" \
            -o "opus-${OPUS_VERSION}.tar.gz"

          tar xf "opus-${OPUS_VERSION}.tar.gz"

          cd "opus-${OPUS_VERSION}"

          echo ""
          echo "Configuring static build..."

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-doc \
            --disable-extra-programs

          echo ""
          echo "Building..."

          make -j"$(sysctl -n hw.ncpu)"

          echo ""
          echo "Installing..."

          make install

      # ================================================================
      # Verify Opus static library
      # ================================================================

      - name: Verify Opus static library
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Opus static library verification"
          echo "========================================"

          OPUS_STATIC_LIB="$PREFIX/lib/libopus.a"

          if [ ! -f "$OPUS_STATIC_LIB" ]; then
            echo "ERROR: Static libopus.a was not found:"
            echo "$OPUS_STATIC_LIB"
            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$OPUS_STATIC_LIB"

          echo ""
          echo "File type:"
          file "$OPUS_STATIC_LIB"

          if ! file "$OPUS_STATIC_LIB" | grep -q "current ar archive"; then
            echo "ERROR: Opus is not an ar static archive."
            exit 1
          fi

          echo ""
          echo "Archive contents:"
          ar -t "$OPUS_STATIC_LIB" | head -30

          echo ""
          echo "Static library size:"
          ls -lh "$OPUS_STATIC_LIB"

          echo ""
          echo "Opus static library verified successfully."

      # ================================================================
      # Verify pkg-config
      # ================================================================

      - name: Verify pkg-config
        shell: bash
        run: |
          set -euo pipefail

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          echo "========================================"
          echo "pkg-config"
          echo "========================================"

          echo ""
          echo "pkg-config files:"
          find "$PREFIX/lib/pkgconfig" \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "========================================"
          echo "SVT-AV1"
          echo "========================================"

          pkg-config --modversion SvtAv1Enc

          echo ""
          echo "Compiler flags:"
          pkg-config --cflags SvtAv1Enc

          echo ""
          echo "Linker flags:"
          pkg-config --libs SvtAv1Enc

          echo ""
          echo "========================================"
          echo "Opus"
          echo "========================================"

          pkg-config --modversion opus

          echo ""
          echo "Compiler flags:"
          pkg-config --cflags opus

          echo ""
          echo "Linker flags:"
          pkg-config --libs opus

      # ================================================================
      # Build FFmpeg
      # ================================================================

      - name: Build FFmpeg
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building FFmpeg $FFMPEG_VERSION"
          echo "========================================"

          git clone \
            https://git.ffmpeg.org/ffmpeg.git \
            ffmpeg

          cd ffmpeg

          git checkout "$FFMPEG_COMMIT"

          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo ""
          echo "FFmpeg commit:"
          echo "$ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$FFMPEG_COMMIT" ]; then
            echo "ERROR: FFmpeg commit mismatch."
            echo "Expected: $FFMPEG_COMMIT"
            echo "Actual:   $ACTUAL_COMMIT"
            exit 1
          fi

          echo ""
          echo "FFmpeg version:"
          git describe --tags --always --dirty

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          echo ""
          echo "========================================"
          echo "Configuring FFmpeg"
          echo "========================================"

          ./configure \
            --prefix="$PREFIX/ffmpeg" \
            --cc=clang \
            --cxx=clang++ \
            --arch=x86_64 \
            --target-os=darwin \
            --disable-debug \
            --disable-doc \
            --disable-autodetect \
            --disable-shared \
            --enable-static \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-avcodec \
            --enable-avformat \
            --enable-avfilter \
            --enable-swscale \
            --enable-swresample \
            --enable-protocol=file \
            --enable-protocol=pipe \
            --enable-libsvtav1 \
            --enable-libopus \
            --enable-gpl \
            --enable-version3 \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib"

          echo ""
          echo "========================================"
          echo "FFmpeg configuration"
          echo "========================================"

          grep -E \
            'CONFIG_LIBSVTAV1|CONFIG_LIBOPUS|CONFIG_FFPROBE|CONFIG_FFPLAY' \
            config.h \
            || true

          echo ""
          echo "FFmpeg libraries:"

          grep -E \
            'CONFIG_AVCODEC|CONFIG_AVFORMAT|CONFIG_AVFILTER|CONFIG_SWSCALE|CONFIG_SWRESAMPLE' \
            config.h \
            || true

          echo ""
          echo "Building..."

          make -j"$(sysctl -n hw.ncpu)"

          echo ""
          echo "Installing..."

          make install

      # ================================================================
      # Verify FFmpeg binaries
      # ================================================================

      - name: Verify FFmpeg binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FFmpeg binaries"
          echo "========================================"

          BIN_DIR="$PREFIX/ffmpeg/bin"

          if [ ! -d "$BIN_DIR" ]; then
            echo "ERROR: FFmpeg binary directory does not exist."
            exit 1
          fi

          ls -lh "$BIN_DIR"

          for BINARY in ffmpeg ffprobe; do
            BIN="$BIN_DIR/$BINARY"

            if [ ! -x "$BIN" ]; then
              echo "ERROR: $BINARY was not built."
              exit 1
            fi

            echo ""
            echo "----------------------------------------"
            echo "$BINARY"
            echo "----------------------------------------"

            file "$BIN"
            lipo -info "$BIN"

            if ! file "$BIN" | grep -q \
              "Mach-O 64-bit executable x86_64"; then
              echo "ERROR: $BINARY is not a macOS x86_64 executable."
              exit 1
            fi
          done

          if [ -e "$BIN_DIR/ffplay" ]; then
            echo ""
            echo "WARNING: ffplay was built."
            echo "It is not included in the final package."
          fi

          echo ""
          echo "SUCCESS: FFmpeg and FFprobe are valid x86_64 Mach-O binaries."

      # ================================================================
      # Verify FFmpeg features
      # ================================================================

      - name: Verify FFmpeg features
        shell: bash
        run: |
          set -euo pipefail

          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          echo "========================================"
          echo "FFmpeg version"
          echo "========================================"

          "$FF" -hide_banner -version

          echo ""
          echo "========================================"
          echo "SVT-AV1 encoder"
          echo "========================================"

          if ! "$FF" \
            -hide_banner \
            -encoders \
            | grep -E '[[:space:]]libsvtav1[[:space:]]'; then
            echo "ERROR: libsvtav1 encoder was not built."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Opus encoder"
          echo "========================================"

          if ! "$FF" \
            -hide_banner \
            -encoders \
            | grep -E '[[:space:]]libopus[[:space:]]'; then
            echo "ERROR: libopus encoder was not built."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "SRT subtitle encoder"
          echo "========================================"

          if ! "$FF" \
            -hide_banner \
            -encoders \
            | grep -E '[[:space:]]srt[[:space:]]'; then
            echo "ERROR: SRT subtitle encoder was not built."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Required filters"
          echo "========================================"

          FILTERS="$("$FF" -hide_banner -filters)"

          for FILTER in scale fps setsar dynaudnorm; do
            if ! echo "$FILTERS" | grep -E -q \
              "(^|[[:space:]])${FILTER}([[:space:]]|$)"; then
              echo "ERROR: Required filter '$FILTER' was not built."
              exit 1
            fi

            echo "OK: $FILTER"
          done

          echo ""
          echo "========================================"
          echo "10-bit pixel format"
          echo "========================================"

          if ! "$FF" \
            -hide_banner \
            -pix_fmts \
            | grep -E '[[:space:]]yuv420p10le'; then
            echo "ERROR: yuv420p10le was not built."
            exit 1
          fi

          echo ""
          echo "FFmpeg feature verification passed."

      # ================================================================
      # Verify dynamic dependencies
      # ================================================================

      - name: Verify dynamic dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Dynamic dependency verification"
          echo "========================================"

          for BINARY in ffmpeg ffprobe; do
            BIN="$PREFIX/ffmpeg/bin/$BINARY"

            echo ""
            echo "----------------------------------------"
            echo "$BINARY"
            echo "----------------------------------------"

            otool -L "$BIN"

            if otool -L "$BIN" | grep -Ei \
              'SvtAv1|svtav1|libopus|libopus\.|/opus/'; then

              echo ""
              echo "ERROR: $BINARY has a dynamic dependency"
              echo "on SVT-AV1 or Opus."

              exit 1
            fi
          done

          echo ""
          echo "SUCCESS:"
          echo "No dynamic SVT-AV1 or Opus dependencies found."

      # ================================================================
      # Verify embedded SVT-AV1
      # ================================================================

      - name: Verify embedded SVT-AV1
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SVT-AV1 static link verification"
          echo "========================================"

          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          SVT_SYMBOLS="$(
            nm -g "$FF" 2>/dev/null \
              | grep -Ei \
                'svt_av1|svt_aom|eb_enc' \
              || true
          )"

          if [ -z "$SVT_SYMBOLS" ]; then
            echo "ERROR: No SVT-AV1 symbols were found"
            echo "inside the FFmpeg executable."
            exit 1
          fi

          echo ""
          echo "SVT-AV1 symbols found:"
          echo "$SVT_SYMBOLS" | head -20

          echo ""
          echo "SUCCESS: SVT-AV1 is statically embedded in FFmpeg."

      # ================================================================
      # Verify embedded Opus
      # ================================================================

      - name: Verify embedded Opus
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Opus static link verification"
          echo "========================================"

          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          OPUS_SYMBOLS="$(
            nm -g "$FF" 2>/dev/null \
              | grep -E \
                '(_?opus_|opus_encoder|opus_decoder|opus_multistream)' \
              || true
          )"

          if [ -z "$OPUS_SYMBOLS" ]; then
            echo "ERROR: No Opus symbols were found"
            echo "inside the FFmpeg executable."
            exit 1
          fi

          echo ""
          echo "Opus symbols found:"
          echo "$OPUS_SYMBOLS" | head -20

          echo ""
          echo "SUCCESS: Opus is statically embedded in FFmpeg."

      # ================================================================
      # Real SVT-AV1 encoding test
      # ================================================================

      - name: Test SVT-AV1 encoding
        shell: bash
        run: |
          set -euo pipefail

          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          echo "========================================"
          echo "Testing SVT-AV1 encoding"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -f lavfi \
            -i "color=c=black:s=320x240:r=1" \
            -frames:v 2 \
            -c:v libsvtav1 \
            -preset 5 \
            -crf 32 \
            -g 240 \
            -pix_fmt yuv420p10le \
            -svtav1-params "tune=0:film-grain=8" \
            -f ivf \
            "$BUILD_ROOT/test-svtav1.ivf"

          if [ ! -s "$BUILD_ROOT/test-svtav1.ivf" ]; then
            echo "ERROR: SVT-AV1 encoding test failed."
            exit 1
          fi

          echo ""
          echo "SVT-AV1 encoding test passed."

          ls -lh "$BUILD_ROOT/test-svtav1.ivf"

      # ================================================================
      # Real Opus encoding test
      # ================================================================

      - name: Test Opus encoding
        shell: bash
        run: |
          set -euo pipefail

          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          echo "========================================"
          echo "Testing Opus encoding"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -f lavfi \
            -i "sine=frequency=1000:sample_rate=48000" \
            -t 2 \
            -c:a libopus \
            -b:a 256k \
            -ac 2 \
            "$BUILD_ROOT/test-opus.ogg"

          if [ ! -s "$BUILD_ROOT/test-opus.ogg" ]; then
            echo "ERROR: Opus encoding test failed."
            exit 1
          fi

          echo ""
          echo "Opus encoding test passed."

          ls -lh "$BUILD_ROOT/test-opus.ogg"

      # ================================================================
      # Combined AV1 + Opus test
      # ================================================================

      - name: Test combined AV1 and Opus encoding
        shell: bash
        run: |
          set -euo pipefail

          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          echo "========================================"
          echo "Testing combined AV1 + Opus encoding"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -f lavfi \
            -i "testsrc2=size=640x360:rate=30" \
            -f lavfi \
            -i "sine=frequency=1000:sample_rate=48000" \
            -t 3 \
            -vf "scale=320:-2:flags=lanczos,setsar=1,fps=30" \
            -c:v libsvtav1 \
            -preset 5 \
            -crf 32 \
            -g 240 \
            -pix_fmt yuv420p10le \
            -svtav1-params "tune=0:film-grain=8" \
            -color_primaries bt709 \
            -color_trc bt709 \
            -colorspace bt709 \
            -c:a libopus \
            -b:a 256k \
            -ac 2 \
            -af dynaudnorm \
            -f matroska \
            "$BUILD_ROOT/test-target.mkv"

          if [ ! -s "$BUILD_ROOT/test-target.mkv" ]; then
            echo "ERROR: Combined encoding test failed."
            exit 1
          fi

          echo ""
          echo "Combined AV1 + Opus encoding test passed."

          ls -lh "$BUILD_ROOT/test-target.mkv"

      # ================================================================
      # FFprobe test
      # ================================================================

      - name: Test FFprobe
        shell: bash
        run: |
          set -euo pipefail

          FFPROBE="$PREFIX/ffmpeg/bin/ffprobe"

          echo "========================================"
          echo "Testing FFprobe"
          echo "========================================"

          "$FFPROBE" \
            -hide_banner \
            -show_streams \
            -show_format \
            "$BUILD_ROOT/test-target.mkv"

          echo ""
          echo "FFprobe test passed."

      # ================================================================
      # Prepare distribution
      # ================================================================

      - name: Prepare distribution
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME"

          mkdir -p "$PACKAGE_DIR/bin"
          mkdir -p "$PACKAGE_DIR/licenses"

          cp \
            "$PREFIX/ffmpeg/bin/ffmpeg" \
            "$PACKAGE_DIR/bin/ffmpeg"

          cp \
            "$PREFIX/ffmpeg/bin/ffprobe" \
            "$PACKAGE_DIR/bin/ffprobe"

          if [ -f "$SRC_DIR/svt-av1/LICENSE" ]; then
            cp \
              "$SRC_DIR/svt-av1/LICENSE" \
              "$PACKAGE_DIR/licenses/SVT-AV1-LICENSE"
          fi

          if [ -f "$SRC_DIR/opus-${OPUS_VERSION}/COPYING" ]; then
            cp \
              "$SRC_DIR/opus-${OPUS_VERSION}/COPYING" \
              "$PACKAGE_DIR/licenses/Opus-COPYING"
          fi

          if [ -f "$SRC_DIR/ffmpeg/COPYING.LGPLv2.1" ]; then
            cp \
              "$SRC_DIR/ffmpeg/COPYING.LGPLv2.1" \
              "$PACKAGE_DIR/licenses/FFmpeg-COPYING.LGPLv2.1"
          fi

          if [ -f "$SRC_DIR/ffmpeg/COPYING.GPLv2" ]; then
            cp \
              "$SRC_DIR/ffmpeg/COPYING.GPLv2" \
              "$PACKAGE_DIR/licenses/FFmpeg-COPYING.GPLv2"
          fi

          if [ -f "$SRC_DIR/ffmpeg/COPYING.GPLv3" ]; then
            cp \
              "$SRC_DIR/ffmpeg/COPYING.GPLv3" \
              "$PACKAGE_DIR/licenses/FFmpeg-COPYING.GPLv3"
          fi

      # ================================================================
      # Verify final package
      # ================================================================

      - name: Verify final package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME"

          echo "========================================"
          echo "Final package"
          echo "========================================"

          find "$PACKAGE_DIR" -print

          echo ""
          echo "========================================"
          echo "Verify binaries"
          echo "========================================"

          for BINARY in ffmpeg ffprobe; do
            BIN="$PACKAGE_DIR/bin/$BINARY"

            if [ ! -x "$BIN" ]; then
              echo "ERROR: Missing binary: $BINARY"
              exit 1
            fi

            file "$BIN"

            if ! file "$BIN" | grep -q \
              "Mach-O 64-bit executable x86_64"; then
              echo "ERROR: $BINARY is not x86_64."
              exit 1
            fi
          done

          if [ -e "$PACKAGE_DIR/bin/ffplay" ]; then
            echo "ERROR: Unexpected ffplay binary found."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Verify external libraries"
          echo "========================================"

          if find "$PACKAGE_DIR" \
            -type f \
            \( \
              -name "*SvtAv1*.dylib*" \
              -o -name "*svtav1*.dylib*" \
              -o -name "libopus*.dylib*" \
            \) \
            | grep -q .; then

            echo "ERROR: External SVT-AV1 or Opus libraries"
            echo "were found in the final package."

            exit 1
          fi

          echo ""
          echo "No external SVT-AV1 or Opus libraries found."

          echo ""
          echo "Final package verification passed."

      # ================================================================
      # Final static-link verification
      # ================================================================

      - name: Final static-link verification
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME"
          FF="$PACKAGE_DIR/bin/ffmpeg"

          echo "========================================"
          echo "Final static-link verification"
          echo "========================================"

          echo ""
          echo "Dynamic dependencies:"
          otool -L "$FF"

          if otool -L "$FF" | grep -Ei \
            'SvtAv1|svtav1|libopus|libopus\.|/opus/'; then

            echo ""
            echo "ERROR: Dynamic SVT-AV1 or Opus dependency found."
            exit 1
          fi

          echo ""
          echo "No dynamic SVT-AV1 or Opus dependencies."

          echo ""
          echo "========================================"
          echo "SVT-AV1 symbols"
          echo "========================================"

          SVT_SYMBOLS="$(
            nm -g "$FF" 2>/dev/null \
              | grep -Ei \
                'svt_av1|svt_aom|eb_enc' \
              || true
          )"

          if [ -z "$SVT_SYMBOLS" ]; then
            echo "ERROR: SVT-AV1 symbols not found."
            exit 1
          fi

          echo "$SVT_SYMBOLS" | head -20

          echo ""
          echo "========================================"
          echo "Opus symbols"
          echo "========================================"

          OPUS_SYMBOLS="$(
            nm -g "$FF" 2>/dev/null \
              | grep -E \
                '(_?opus_|opus_encoder|opus_decoder|opus_multistream)' \
              || true
          )"

          if [ -z "$OPUS_SYMBOLS" ]; then
            echo "ERROR: Opus symbols not found."
            exit 1
          fi

          echo "$OPUS_SYMBOLS" | head -20

          echo ""
          echo "========================================"
          echo "STATIC LINK VERIFICATION PASSED"
          echo "========================================"

      # ================================================================
      # Create README
      # ================================================================

      - name: Create README
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME"

          printf '%s\n' \
            "FFmpeg macOS Intel build" \
            "" \
            "Package:" \
            "  $PACKAGE_NAME" \
            "" \
            "Architecture:" \
            "  x86_64" \
            "" \
            "Target:" \
            "  macOS Intel" \
            "" \
            "FFmpeg:" \
            "  $FFMPEG_VERSION" \
            "  commit: $FFMPEG_COMMIT" \
            "" \
            "SVT-AV1:" \
            "  $SVT_AV1_VERSION" \
            "  statically linked into ffmpeg" \
            "" \
            "Opus:" \
            "  $OPUS_VERSION" \
            "  statically linked into ffmpeg" \
            "" \
            "Included binaries:" \
            "  ffmpeg" \
            "  ffprobe" \
            "" \
            "External libraries:" \
            "  SVT-AV1: statically linked" \
            "  Opus: statically linked" \
            "" \
            "No SVT-AV1 or Opus dynamic libraries" \
            "are required at runtime." \
            "" \
            "Required video features:" \
            "  libsvtav1" \
            "  yuv420p10le" \
            "  scale" \
            "  fps" \
            "  setsar" \
            "" \
            "Required audio features:" \
            "  libopus" \
            "  dynaudnorm" \
            "" \
            "Subtitle support:" \
            "  SRT" \
            "" \
            "Example video encoding:" \
            "  -c:v libsvtav1" \
            "  -preset 5" \
            "  -crf 32" \
            "  -g 240" \
            "  -pix_fmt yuv420p10le" \
            "  -svtav1-params tune=0:film-grain=8" \
            "" \
            "Example video filter:" \
            "  -vf scale=1920:-2:flags=lanczos,setsar=1,fps=30" \
            "" \
            "Example audio encoding:" \
            "  -c:a libopus" \
            "  -b:a 256k" \
            "  -ac 2" \
            "  -af dynaudnorm" \
            "" \
            "Example subtitle encoding:" \
            "  -c:s srt" \
            "" \
            "SVT-AV1 and Opus are statically linked" \
            "into the ffmpeg executable." \
            "" \
            "This package was built for Intel Macs (x86_64)." \
            > "$PACKAGE_DIR/README.txt"

          echo ""
          echo "README created:"
          cat "$PACKAGE_DIR/README.txt"

      # ================================================================
      # Create archive
      # ================================================================

      - name: Create archive
        working-directory: ${{ env.GITHUB_WORKSPACE }}/dist
        shell: bash
        run: |
          set -euo pipefail

          tar \
            -czf \
            "$PACKAGE_NAME.tar.gz" \
            "$PACKAGE_NAME"

          echo ""
          echo "Created archive:"
          ls -lh "$PACKAGE_NAME.tar.gz"

      # ================================================================
      # Upload artifact
      # ================================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 30
