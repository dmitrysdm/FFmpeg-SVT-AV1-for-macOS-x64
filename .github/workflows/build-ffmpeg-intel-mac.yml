name: Build FFmpeg for macOS Intel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEG_VERSION: "9.0.1"
  FFMPEG_COMMIT: "bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa"

  SVT_AV1_VERSION: "4.2.0"
  SVT_AV1_TAG: "v4.2.0"

  OPUS_VERSION: "1.5.2"

  PACKAGE_NAME: "FFmpeg-9.0.1-SVT-AV1-4.2.0-for-macOS-x64"

jobs:
  build:
    name: Build FFmpeg 9.0.1 for macOS Intel
    runs-on: macos-13

    steps:

      # Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install build tools required for FFmpeg, SVT-AV1 and Opus.
      - name: Install build dependencies
        run: |
          brew install \
            cmake \
            nasm \
            pkg-config \
            autoconf \
            automake \
            libtool

      # Verify that the GitHub runner is Intel x86_64.
      - name: Verify build architecture
        run: |
          echo "========================================"
          echo "System"
          echo "========================================"

          uname -a

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CPU:"
          sysctl -n machdep.cpu.brand_string

          echo ""
          echo "CPU cores:"
          sysctl -n hw.ncpu

          echo ""
          echo "Compiler:"
          clang --version

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "NASM:"
          nasm -v

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "ERROR: This workflow requires an Intel x86_64 runner."
            exit 1
          fi

      # Prepare source, build, installation and distribution directories.
      - name: Prepare directories
        run: |
          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$GITHUB_WORKSPACE/dist"

          mkdir -p "$GITHUB_WORKSPACE/build/src"
          mkdir -p "$GITHUB_WORKSPACE/build/prefix"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          echo "BUILD_ROOT=$GITHUB_WORKSPACE/build" >> "$GITHUB_ENV"
          echo "SRC_DIR=$GITHUB_WORKSPACE/build/src" >> "$GITHUB_ENV"
          echo "PREFIX=$GITHUB_WORKSPACE/build/prefix" >> "$GITHUB_ENV"

      # Build SVT-AV1 4.2.0 as a static library.
      - name: Build SVT-AV1
        working-directory: ${{ env.SRC_DIR }}
        run: |
          git clone \
            --depth 1 \
            --branch "$SVT_AV1_TAG" \
            https://github.com/AOMediaCodec/SVT-AV1.git \
            svt-av1

          cd svt-av1

          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_NASM=ON

          cmake \
            --build build \
            --parallel "$(sysctl -n hw.ncpu)"

          cmake \
            --install build

      # Verify that SVT-AV1 produced a static archive.
      - name: Verify SVT-AV1 static library
        run: |
          echo "========================================"
          echo "SVT-AV1 static library"
          echo "========================================"

          find "$PREFIX/lib" \
            -maxdepth 1 \
            -type f \
            -name "libSvtAv1Enc*.a" \
            -print

          SVT_STATIC_LIB="$(find "$PREFIX/lib" \
            -maxdepth 1 \
            -type f \
            -name "libSvtAv1Enc*.a" \
            | head -1)"

          if [ -z "$SVT_STATIC_LIB" ]; then
            echo "ERROR: Static SVT-AV1 library was not found."
            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$SVT_STATIC_LIB"

          echo ""
          echo "File type:"
          file "$SVT_STATIC_LIB"

          echo ""
          echo "Archive contents:"
          ar -t "$SVT_STATIC_LIB" | head -30

          echo ""
          echo "SVT-AV1 static library verified successfully."

      # Build Opus as a static library.
      - name: Build libopus
        working-directory: ${{ env.SRC_DIR }}
        run: |
          curl -L \
            "https://github.com/xiph/opus/releases/download/v${OPUS_VERSION}/opus-${OPUS_VERSION}.tar.gz" \
            -o "opus-${OPUS_VERSION}.tar.gz"

          tar xf "opus-${OPUS_VERSION}.tar.gz"

          cd "opus-${OPUS_VERSION}"

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-doc \
            --disable-extra-programs

          make -j"$(sysctl -n hw.ncpu)"
          make install

      # Verify that Opus produced a static archive.
      - name: Verify Opus static library
        run: |
          echo "========================================"
          echo "Opus static library"
          echo "========================================"

          if [ ! -f "$PREFIX/lib/libopus.a" ]; then
            echo "ERROR: Static libopus.a was not found."
            exit 1
          fi

          echo "Found:"
          echo "$PREFIX/lib/libopus.a"

          echo ""
          echo "File type:"
          file "$PREFIX/lib/libopus.a"

          echo ""
          echo "Archive contents:"
          ar -t "$PREFIX/lib/libopus.a" | head -30

          echo ""
          echo "Opus static library verified successfully."

      # Display the pkg-config files used by FFmpeg.
      - name: Verify pkg-config configuration
        run: |
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          echo "========================================"
          echo "pkg-config files"
          echo "========================================"

          find "$PREFIX/lib/pkgconfig" \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "========================================"
          echo "SVT-AV1 pkg-config"
          echo "========================================"

          pkg-config --modversion SvtAv1Enc

          echo ""
          echo "SVT-AV1 compiler flags:"
          pkg-config --cflags SvtAv1Enc

          echo ""
          echo "SVT-AV1 linker flags:"
          pkg-config --libs SvtAv1Enc

          echo ""
          echo "========================================"
          echo "Opus pkg-config"
          echo "========================================"

          pkg-config --modversion opus

          echo ""
          echo "Opus compiler flags:"
          pkg-config --cflags opus

          echo ""
          echo "Opus linker flags:"
          pkg-config --libs opus

      # Build FFmpeg 9.0.1 from the exact specified commit.
      - name: Build FFmpeg
        working-directory: ${{ env.SRC_DIR }}
        run: |
          git clone \
            https://git.ffmpeg.org/ffmpeg.git \
            ffmpeg

          cd ffmpeg

          git checkout "$FFMPEG_COMMIT"

          echo "========================================"
          echo "FFmpeg commit"
          echo "========================================"

          git rev-parse HEAD

          echo ""
          echo "FFmpeg version:"
          git describe --tags --always --dirty

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          export CPPFLAGS="-I$PREFIX/include"

          export LDFLAGS="-L$PREFIX/lib"

          ./configure \
            --prefix="$PREFIX/ffmpeg" \
            --cc=clang \
            --cxx=clang++ \
            --arch=x86_64 \
            --target-os=darwin \
            --disable-debug \
            --disable-doc \
            --disable-autodetect \
            --enable-ffmpeg \
            --enable-ffplay \
            --enable-ffprobe \
            --enable-avcodec \
            --enable-avformat \
            --enable-avfilter \
            --enable-swscale \
            --enable-swresample \
            --enable-protocol=file \
            --enable-protocol=pipe \
            --enable-libsvtav1 \
            --enable-libopus \
            --enable-gpl \
            --enable-version3 \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib"

          echo ""
          echo "========================================"
          echo "FFmpeg configuration summary"
          echo "========================================"

          grep -E \
            'CONFIG_LIBSVTAV1|CONFIG_LIBOPUS|CONFIG_FFPLAY|CONFIG_FFPROBE' \
            config.h \
            || true

          make -j"$(sysctl -n hw.ncpu)"

          make install

      # Verify that all three FFmpeg binaries were built.
      - name: Verify FFmpeg binaries
        run: |
          echo "========================================"
          echo "FFmpeg binaries"
          echo "========================================"

          ls -lh "$PREFIX/ffmpeg/bin/"

          for BINARY in ffmpeg ffplay ffprobe; do

            BIN="$PREFIX/ffmpeg/bin/$BINARY"

            if [ ! -x "$BIN" ]; then
              echo "ERROR: $BINARY was not built."
              exit 1
            fi

            echo ""
            echo "----------------------------------------"
            echo "$BINARY"
            echo "----------------------------------------"

            file "$BIN"
            lipo -info "$BIN"

            if ! file "$BIN" | grep -q "x86_64"; then
              echo "ERROR: $BINARY was not built for x86_64."
              exit 1
            fi

          done

      # Verify FFmpeg features.
      - name: Verify FFmpeg features
        run: |
          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          echo "========================================"
          echo "SVT-AV1 encoder"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -encoders \
            | grep -E 'libsvtav1'

          echo ""
          echo "========================================"
          echo "Opus encoder"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -encoders \
            | grep -E 'libopus'

          echo ""
          echo "========================================"
          echo "SRT subtitle encoder"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -encoders \
            | grep -E 'srt'

          echo ""
          echo "========================================"
          echo "Required filters"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -filters \
            | grep -E \
              '(^| )scale( |$)|(^| )fps( |$)|(^| )setsar( |$)|(^| )dynaudnorm( |$)'

          echo ""
          echo "========================================"
          echo "10-bit pixel format"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -pix_fmts \
            | grep -E 'yuv420p10le'

      # Verify that no dynamic SVT-AV1 or Opus dependency exists.
      - name: Verify dynamic dependencies
        run: |
          echo "========================================"
          echo "Dynamic dependency verification"
          echo "========================================"

          for BINARY in ffmpeg ffplay ffprobe; do

            BIN="$PREFIX/ffmpeg/bin/$BINARY"

            echo ""
            echo "----------------------------------------"
            echo "$BINARY"
            echo "----------------------------------------"

            otool -L "$BIN"

            if otool -L "$BIN" | grep -Ei \
              'SvtAv1|svtav1|libopus|opus'; then

              echo ""
              echo "ERROR: $BINARY has a dynamic dependency"
              echo "on SVT-AV1 or Opus."
              exit 1
            fi

          done

          echo ""
          echo "SUCCESS:"
          echo "No dynamic SVT-AV1 or Opus dependencies found."

      # Verify that SVT-AV1 symbols are embedded in each binary.
      - name: Verify embedded SVT-AV1 symbols
        run: |
          echo "========================================"
          echo "SVT-AV1 symbol verification"
          echo "========================================"

          for BINARY in ffmpeg ffplay ffprobe; do

            BIN="$PREFIX/ffmpeg/bin/$BINARY"

            echo ""
            echo "----------------------------------------"
            echo "$BINARY"
            echo "----------------------------------------"

            SVT_SYMBOL_COUNT="$(
              nm -g "$BIN" 2>/dev/null \
                | grep -Ei \
                  'svt_av1|svt_aom|eb_enc' \
                | wc -l \
                | tr -d ' '
            )"

            echo "SVT-AV1 related symbols:"
            echo "$SVT_SYMBOL_COUNT"

            if [ "$SVT_SYMBOL_COUNT" -eq 0 ]; then
              echo ""
              echo "ERROR: No SVT-AV1 symbols were found"
              echo "inside $BINARY."
              exit 1
            fi

            echo "SVT-AV1 code is embedded in $BINARY."

          done

      # Verify that Opus symbols are embedded in each binary.
      - name: Verify embedded Opus symbols
        run: |
          echo "========================================"
          echo "Opus symbol verification"
          echo "========================================"

          for BINARY in ffmpeg ffplay ffprobe; do

            BIN="$PREFIX/ffmpeg/bin/$BINARY"

            echo ""
            echo "----------------------------------------"
            echo "$BINARY"
            echo "----------------------------------------"

            OPUS_SYMBOL_COUNT="$(
              nm -g "$BIN" 2>/dev/null \
                | grep -E \
                  ' opus_|opus_encoder|opus_decoder|opus_multistream' \
                | wc -l \
                | tr -d ' '
            )"

            echo "Opus related symbols:"
            echo "$OPUS_SYMBOL_COUNT"

            if [ "$OPUS_SYMBOL_COUNT" -eq 0 ]; then
              echo ""
              echo "ERROR: No Opus symbols were found"
              echo "inside $BINARY."
              exit 1
            fi

            echo "Opus code is embedded in $BINARY."

          done

      # Run a real SVT-AV1 encoding test.
      - name: Test static SVT-AV1 encoding
        run: |
          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          echo "========================================"
          echo "Testing SVT-AV1 encoding"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -f lavfi \
            -i "color=c=black:s=320x240:r=1" \
            -frames:v 2 \
            -c:v libsvtav1 \
            -preset 5 \
            -crf 32 \
            -g 240 \
            -pix_fmt yuv420p10le \
            -svtav1-params "tune=0:film-grain=8" \
            -f ivf \
            "$BUILD_ROOT/test-svtav1.ivf"

          if [ ! -s "$BUILD_ROOT/test-svtav1.ivf" ]; then
            echo "ERROR: SVT-AV1 encoding test failed."
            exit 1
          fi

          echo ""
          echo "SVT-AV1 encoding test passed."

          ls -lh "$BUILD_ROOT/test-svtav1.ivf"

      # Run a real Opus encoding test.
      - name: Test static Opus encoding
        run: |
          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          echo "========================================"
          echo "Testing Opus encoding"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -f lavfi \
            -i "sine=frequency=1000:sample_rate=48000" \
            -t 2 \
            -c:a libopus \
            -b:a 256k \
            -ac 2 \
            "$BUILD_ROOT/test-opus.ogg"

          if [ ! -s "$BUILD_ROOT/test-opus.ogg" ]; then
            echo "ERROR: Opus encoding test failed."
            exit 1
          fi

          echo ""
          echo "Opus encoding test passed."

          ls -lh "$BUILD_ROOT/test-opus.ogg"

      # Run a combined video and audio encoding test using the target parameters.
      - name: Test target encoding configuration
        run: |
          FF="$PREFIX/ffmpeg/bin/ffmpeg"

          echo "========================================"
          echo "Testing target encoding configuration"
          echo "========================================"

          "$FF" \
            -hide_banner \
            -f lavfi \
            -i "testsrc2=size=640x360:rate=30" \
            -f lavfi \
            -i "sine=frequency=1000:sample_rate=48000" \
            -t 3 \
            -vf "scale=320:-2:flags=lanczos,setsar=1,fps=30" \
            -c:v libsvtav1 \
            -preset 5 \
            -crf 32 \
            -g 240 \
            -pix_fmt yuv420p10le \
            -svtav1-params "tune=0:film-grain=8" \
            -color_primaries bt709 \
            -color_trc bt709 \
            -colorspace bt709 \
            -c:a libopus \
            -b:a 256k \
            -ac 2 \
            -af dynaudnorm \
            -f matroska \
            "$BUILD_ROOT/test-target.mkv"

          if [ ! -s "$BUILD_ROOT/test-target.mkv" ]; then
            echo "ERROR: Target encoding test failed."
            exit 1
          fi

          echo ""
          echo "Target encoding configuration passed."

          ls -lh "$BUILD_ROOT/test-target.mkv"

      # Verify the generated test file with FFprobe.
      - name: Test FFprobe
        run: |
          FFPROBE="$PREFIX/ffmpeg/bin/ffprobe"

          echo "========================================"
          echo "Testing FFprobe"
          echo "========================================"

          "$FFPROBE" \
            -hide_banner \
            -show_streams \
            -show_format \
            "$BUILD_ROOT/test-target.mkv"

      # Test FFplay startup.
      - name: Test FFplay
        run: |
          FFPLAY="$PREFIX/ffmpeg/bin/ffplay"

          echo "========================================"
          echo "Testing FFplay"
          echo "========================================"

          "$FFPLAY" \
            -hide_banner \
            -version

      # Prepare the final distribution package.
      - name: Prepare distribution
        run: |
          PACKAGE_DIR="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME"

          mkdir -p "$PACKAGE_DIR/bin"
          mkdir -p "$PACKAGE_DIR/licenses"

          # Copy FFmpeg.
          cp \
            "$PREFIX/ffmpeg/bin/ffmpeg" \
            "$PACKAGE_DIR/bin/ffmpeg"

          # Copy FFplay.
          cp \
            "$PREFIX/ffmpeg/bin/ffplay" \
            "$PACKAGE_DIR/bin/ffplay"

          # Copy FFprobe.
          cp \
            "$PREFIX/ffmpeg/bin/ffprobe" \
            "$PACKAGE_DIR/bin/ffprobe"

          # Copy SVT-AV1 license.
          if [ -f "$SRC_DIR/svt-av1/LICENSE" ]; then
            cp \
              "$SRC_DIR/svt-av1/LICENSE" \
              "$PACKAGE_DIR/licenses/SVT-AV1-LICENSE"
          fi

          # Copy Opus license.
          if [ -f "$SRC_DIR/opus-${OPUS_VERSION}/COPYING" ]; then
            cp \
              "$SRC_DIR/opus-${OPUS_VERSION}/COPYING" \
              "$PACKAGE_DIR/licenses/Opus-COPYING"
          fi

          # Copy FFmpeg license.
          if [ -f "$SRC_DIR/ffmpeg/COPYING.LGPLv2.1" ]; then
            cp \
              "$SRC_DIR/ffmpeg/COPYING.LGPLv2.1" \
              "$PACKAGE_DIR/licenses/FFmpeg-COPYING.LGPLv2.1"
          fi

      # Verify that the final package contains no external SVT-AV1 or Opus libraries.
      - name: Verify final package
        run: |
          PACKAGE_DIR="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME"

          echo "========================================"
          echo "Final package"
          echo "========================================"

          find "$PACKAGE_DIR" -print

          echo ""
          echo "========================================"
          echo "Binaries"
          echo "========================================"

          ls -lh "$PACKAGE_DIR/bin/"

          echo ""
          echo "========================================"
          echo "External libraries in package"
          echo "========================================"

          if find "$PACKAGE_DIR" \
            -type f \
            \( \
              -name "*SvtAv1*.dylib*" \
              -o -name "*svtav1*.dylib*" \
              -o -name "libopus*.dylib*" \
            \) \
            | grep -q .; then

            echo "ERROR: External SVT-AV1 or Opus libraries"
            echo "were found in the final package."
            exit 1
          fi

          echo "No external SVT-AV1 or Opus libraries found."

      # Perform one final static-link verification on packaged binaries.
      - name: Final static-link verification
        run: |
          PACKAGE_DIR="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME"

          for BINARY in ffmpeg ffplay ffprobe; do

            BIN="$PACKAGE_DIR/bin/$BINARY"

            echo ""
            echo "========================================"
            echo "$BINARY"
            echo "========================================"

            echo "Dynamic dependencies:"
            otool -L "$BIN"

            echo ""
            echo "SVT-AV1 symbols:"
            nm -g "$BIN" 2>/dev/null \
              | grep -Ei \
                'svt_av1|svt_aom|eb_enc' \
              | head -10 \
              || true

            echo ""
            echo "Opus symbols:"
            nm -g "$BIN" 2>/dev/null \
              | grep -E \
                ' opus_|opus_encoder|opus_decoder|opus_multistream' \
              | head -10 \
              || true

            if otool -L "$BIN" | grep -Ei \
              'SvtAv1|svtav1|libopus|opus'; then

              echo ""
              echo "ERROR: Dynamic SVT-AV1 or Opus dependency found."
              exit 1
            fi

          done

          echo ""
          echo "========================================"
          echo "STATIC LINK VERIFICATION PASSED"
          echo "========================================"

      # Create package metadata.
      - name: Create README
        run: |
          PACKAGE_DIR="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME"

          cat > "$PACKAGE_DIR/README.txt" <<EOF
          FFmpeg macOS Intel build

          Package:
            $PACKAGE_NAME

          Architecture:
            x86_64

          Target:
            macOS Intel

          FFmpeg:
            $FFMPEG_VERSION
            commit: $FFMPEG_COMMIT

          SVT-AV1:
            $SVT_AV1_VERSION
            statically linked

          Opus:
            $OPUS_VERSION
            statically linked

          Included binaries:
            ffmpeg
            ffplay
            ffprobe

          External libraries:
            SVT-AV1: statically linked
            Opus: statically linked

          No SVT-AV1 or Opus dynamic libraries
          are required at runtime.

          Required video features:
            libsvtav1
            yuv420p10le
            scale
            fps
            setsar

          Required audio features:
            libopus
            dynaudnorm

          Subtitle support:
            SRT

          Example video encoding:

            -c:v libsvtav1
            -preset 5
            -crf 32
            -g 240
            -pix_fmt yuv420p10le
            -svtav1-params tune=0:film-grain=8

          Example video filter:

            -vf scale=1920:-2:flags=lanczos,setsar=1,fps=30

          Example audio encoding:

            -c:a libopus
            -b:a 256k
            -ac 2
            -af dynaudnorm

          Example subtitle encoding:

            -c:s srt

          SVT-AV1 and Opus are statically linked
          into ffmpeg, ffplay and ffprobe.

          This package was built for Intel Macs (x86_64).
          EOF

      # Create the final tar.gz archive.
      - name: Create archive
        working-directory: ${{ env.GITHUB_WORKSPACE }}/dist
        run: |
          tar \
            -czf \
            "$PACKAGE_NAME.tar.gz" \
            "$PACKAGE_NAME"

          echo "Created archive:"
          ls -lh "$PACKAGE_NAME.tar.gz"

      # Upload the final package as a GitHub Actions artifact.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 30
